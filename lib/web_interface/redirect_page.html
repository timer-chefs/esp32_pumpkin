R"rawliteral(R"rawliteral(<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 2em;
        }
        h2 { color: #333; }
        button {
            font-size: 1.5em;
            padding: 0.5em 1.5em;
            margin-top: 1em;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        #status {
            margin-top: 1em;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Pumpkin</h1>
    <p>Press the button to go to your pumpkin (only works for the hotspot phone
    - others need to copy the address, reconnect to the hotspot and then paste
    the address).</p>
    <button id="btn">Open Pumpkin</button>
    <p id="status"></p>
    <script>
        document.getElementById("btn").onclick = function () {
            var s = document.getElementById("status");
            s.textContent = "Redirecting...";
            this.disabled = true;
            fetch("/api/ip")
                .then(function (r) { return r.text(); })
                .then(function (ip) {
                    if (ip) {
                        window.location.href = "http://" + ip;
                    }
                });
        };
    </script>
</body>
</html>)rawliteral"
