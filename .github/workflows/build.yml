name: Build PlatformIO project

on:
  push:
    branches: main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  detect-envs:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.get-envs.outputs.environments }}
    steps:
      - uses: actions/checkout@v7
      - id: get-envs
        run: |
          envs=$(grep -oP '(?<=^\[env:)[^\]]+' platformio.ini | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.detect-envs.outputs.environments) }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache PlatformIO toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Cache PlatformIO build
        uses: actions/cache@v6
        with:
          path: |
            .pio/build/${{ matrix.environment }}
            .pio/libdeps/${{ matrix.environment }}
          key: ${{ runner.os }}-pio-build-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pio-build-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  # We can't depend on jobs with dynamic names. So this job acts as a collected
  # "success" status for all of its dependencies. It will only have a "success"
  # status if all of its dependencies succeeded. That way we can configure
  # GitHub to require this job to pass before allowing a merge.
  build-completed-successfully:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Finish
        run: echo "All builds completed"
