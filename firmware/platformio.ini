; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = .littlefs

[esp32s3]
; Pinned: 8.0.0 moves to version 3 of the Arduino core, which this code
; doesn't build with yet. 7.0.1 still has 2.0.17.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram = enabled
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.extra_flags = -DBOARD_HAS_PSRAM
monitor_speed = 115200
build_flags = -Iinclude
board_build.filesystem = littlefs
upload_protocol = esptool 

[sketch]
extra_scripts = pre:scripts/env_defines.py
build_src_filter = +<*> -<.git/> -<.svn/> -<envs/*> +<envs/${PIOENV}/*> ; Build only the sources for the active environment under src/envs/${PIOENV}/

[libraries]
; The upstream FlatBuffers repository includes host-only compiler sources, so
; use it as a header-only runtime instead of letting PlatformIO build it.
build_flags =
    ${esp32s3.build_flags}
    -I.pio/libdeps/${PIOENV}/flatbuffers/include
    ; the library otherwise includes ArduinoSTL's unavailable utility.h.
    -DARDUINOSTL_M_H
lib_ignore = flatbuffers
lib_deps =
    https://github.com/google/flatbuffers.git#v25.9.23
    https://github.com/Links2004/arduinoWebSockets.git#2.7.2
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.4
    fastled/FastLED@3.10.3
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    madhephaestus/ESP32Servo@3.2.1

[env:application]
extends = esp32s3, sketch, libraries

[env:test_sdcard]
extends = esp32s3, sketch
